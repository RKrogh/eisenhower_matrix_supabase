<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eisenhower Matrix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Auth View -->
  <div id="auth-view" class="view">
    <div class="auth-container">
      <h1>Eisenhower Matrix</h1>
      <p>Sign in with a magic link to sync your tasks across devices.</p>
      <form id="magic-link-form">
        <input type="email" id="email-input" placeholder="your@email.com" required autocomplete="email">
        <button type="submit" id="send-link-btn">Send Magic Link</button>
      </form>
      <p id="auth-message" class="auth-message" hidden></p>
    </div>
  </div>

  <!-- App View -->
  <div id="app-view" class="view" hidden>
    <header>
      <h1>Eisenhower Matrix</h1>
      <div class="header-actions">
        <button id="archive-toggle-btn" class="header-btn">Archive</button>
        <span id="user-email"></span>
        <button id="sign-out-btn">Sign Out</button>
      </div>
    </header>

    <!-- Archive View -->
    <div id="archive-view" class="archive-view" hidden>
      <div class="archive-header">
        <h2>Archived Tasks</h2>
        <span id="archive-count" class="archive-count"></span>
      </div>
      <div id="archive-list" class="archive-list"></div>
      <div id="archive-empty" class="archive-empty" hidden>No archived tasks yet.</div>
    </div>

    <div class="matrix">
      <div class="quadrant quadrant-1" data-quadrant="1">
        <div class="quadrant-header">
          <h2>Do</h2>
          <span class="quadrant-subtitle">Urgent &amp; Important</span>
        </div>
        <div class="task-list" data-quadrant="1"></div>
        <form class="add-task-form" data-quadrant="1">
          <input type="text" placeholder="Add task..." required>
          <button type="submit">+</button>
        </form>
      </div>

      <div class="quadrant quadrant-2" data-quadrant="2">
        <div class="quadrant-header">
          <h2>Schedule</h2>
          <span class="quadrant-subtitle">Important, Not Urgent</span>
        </div>
        <div class="task-list" data-quadrant="2"></div>
        <form class="add-task-form" data-quadrant="2">
          <input type="text" placeholder="Add task..." required>
          <button type="submit">+</button>
        </form>
      </div>

      <div class="quadrant quadrant-3" data-quadrant="3">
        <div class="quadrant-header">
          <h2>Delegate</h2>
          <span class="quadrant-subtitle">Urgent, Not Important</span>
        </div>
        <div class="task-list" data-quadrant="3"></div>
        <form class="add-task-form" data-quadrant="3">
          <input type="text" placeholder="Add task..." required>
          <button type="submit">+</button>
        </form>
      </div>

      <div class="quadrant quadrant-4" data-quadrant="4">
        <div class="quadrant-header">
          <h2>Eliminate</h2>
          <span class="quadrant-subtitle">Neither</span>
        </div>
        <div class="task-list" data-quadrant="4"></div>
        <form class="add-task-form" data-quadrant="4">
          <input type="text" placeholder="Add task..." required>
          <button type="submit">+</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Detail Panel -->
  <div id="detail-overlay" class="detail-overlay"></div>
  <div id="detail-panel" class="detail-panel">
    <div class="detail-panel-header">
      <h3>Task Details</h3>
      <button id="detail-close-btn" class="detail-close-btn">x</button>
    </div>
    <div class="detail-panel-body">
      <div class="detail-field">
        <label for="detail-title">Title</label>
        <input type="text" id="detail-title">
      </div>
      <div class="detail-field">
        <label for="detail-status">Status</label>
        <select id="detail-status">
          <option value="todo">Todo</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
          <option value="paused">Paused</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="detail-field">
        <label for="detail-description">Description</label>
        <textarea id="detail-description" placeholder="Add notes..."></textarea>
      </div>
      <div class="detail-field">
        <label for="detail-due-date">Due Date</label>
        <input type="date" id="detail-due-date">
      </div>
      <div class="detail-field">
        <label>Links</label>
        <div id="detail-links" class="links-list"></div>
        <div class="add-link-row">
          <input type="text" id="link-label-input" placeholder="Label">
          <input type="text" id="link-url-input" placeholder="URL or path">
          <button id="add-link-btn">Add</button>
        </div>
      </div>
    </div>
    <div class="detail-panel-footer">
      <div class="detail-footer-actions">
        <button id="detail-archive-btn" class="detail-archive-btn">Archive</button>
        <button id="detail-delete-btn" class="detail-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="supabase.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
